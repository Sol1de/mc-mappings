[package]
name = "mc-mappings"
version = "0.1.0"
edition = "2024"
description = "Minecraft runtime mapping table model and JSON format"
# Publication switch: remove once the licence and the crates.io token are ready (spec/release.md).
publish = false
repository = "https://github.com/Sol1de/mc-mappings"
documentation = "https://docs.rs/mc-mappings"
readme = "README.md"
keywords = ["minecraft", "mappings", "jvm", "obfuscation"]
categories = ["game-development", "data-structures"]
include = ["/src/**", "/data/**", "/spec/**", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
