name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Release workflow tests
        shell: pwsh
        run: ./.github/tests/release-workflow.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --release
      - name: Audit the bundled tables
        run: cargo run --locked --example audit > audit.json
      - run: cargo package --locked --allow-dirty

  publish:
    name: Publish to crates.io and tag
    permissions:
      contents: write
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Sol1de/mc-mappings'
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether the version is already published
        id: version
        run: ./.github/scripts/check-published-version.ps1
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) { throw 'Configure the CARGO_REGISTRY_TOKEN repository secret before publishing.' }
          cargo publish --locked --registry crates-io
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create missing release tag
        if: steps.version.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_REQUIRED: ${{ steps.version.outputs.publish }}
        run: ./.github/scripts/create-release-tag.ps1
